idempotency:
  coverage: none
  mechanism: null
  note: No Idempotency-Key header or replay-protection mechanism is defined. PUT/DELETE on seasonal overrides, temporary AAR exceptions and monitoring sets are idempotent by HTTP method semantics only; POST creates (createSeasonalOverride, createTemporaryAARException, createMonitoringSet, postRealTimeProposal, postRegionalLimitsForecastSnapshot) carry no key.
pagination:
  style: none
  note: Snapshots are returned whole; collection and snapshot operations are filtered by query parameters (resource-id-filter, query-filter, period-start/offset-period-start, period-end, static-only, temporal-resolution) rather than paginated.
conditional_requests:
  mechanism: ETag / If-None-Match (Conditional GET), 304 Not Modified
  requirement: '"TROLIE implementations MUST support the Conditional GET pattern and clients should use it to determine when limits snapshots are available."'
