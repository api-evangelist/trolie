aid: trolie

name: TROLIE

description: TROLIE (Transmission Ratings and Operating Limits Information Exchange) is an open-source LF Energy project, hosted under LF Projects,
  that defines an OpenAPI-based REST specification for exchanging transmission facility ratings and operating limits. It responds to FERC Order
  881, which requires North American Transmission Owners, Transmission Operators, Transmission Providers and Reliability Coordinators to exchange
  ambient-adjusted and forecasted ratings. The project publishes the 1.0 specification, usage examples for forecast, real-time, seasonal and temporary
  ratings, decision records, a conformance suite and a Java client SDK on GitHub.

