- aid: trolie:trolie-temporary-aar-exceptions-api
  name: TROLIE Temporary AAR Exceptions API
  description: "A [Temporary AAR Exception](https://trolie.energy/concepts#temporary-aar-exception) is\n\
    provided by the Ratings Provider when a Ratings Obligation cannot be\nfulfilled, due to some temporary\
    \ operating condition impacting the related\npower system resource.  This could occur in various scenarios:\n\
    \n  * An equipment failure.\n  * An unforeseen condition on a related part of the power grid.\n  *\
    \ Some ambient condition that is not part of the model is heating the\n    line, like a wildfire.\n\
    \  * Something in the surrounding environment is affecting the amount that a\n    line is allowed\
    \ to sag. For example, this may occur for lines over\n    rivers when very large ships pass under\
    \ them\n\nA Temporary AAR Exception serves two main purposes: documenting the reason\nfor the exception\
    \ and providing a temporary rating value set. It is employed\nin three distinct circumstances:\n\n\
    1. Firstly, Order 881 mandates documentation and archival of all use of\n alternate ratings in lieu\
    \ of AARs. Ratings Providers should continue to\n provide real-time and forecast ratings for the affected\
    \ resource, but\n these should match the rating provided with the Temporary AAR Exception\n while\
    \ the latter is in effect. This temporary rating, and the reason that\n it occurred, must be captured\
    \ in history regardless of the provided\n ratings.  The reason and the end date of the effective window\
    \ may be\n updated after the object has been created, up to a configurable threshold.\n\n   If the\
    \ Ratings Providers provides ratings that deviate from the static\n   Temporary AAR Exception rating,\
    \ the Clearinghouse Provider must decide\n   whether to use those or the static rating. The Clearinghouse\
    \ Provider\n   advise its Ratings Providers on how it will choose ahead of time. This\n   specification\
    \ recommends using the dynamic rating provided, but it does\n   not mandate it.\n\n2. Secondly, Temporary\
    \ AAR Exceptions apply when the Clearinghouse\n  Provider is generating forecast rating proposals\
    \ on behalf of the Ratings Provider, e.g., when lookup tables are provided ahead of time by the Ratings\
    \ Provider.\n  Since there is no external ratings, the Clearinghouse Provider\n  wouldn't otherwise\
    \ know that a temporary static rating is needed. \n\n3. Finally, for facilities where dynamic ratings\
    \ are provided, it is\n  possible that a communications outage or other issue could prevent the\n\
    \  Clearinghouse Provider from receiving the dynamic ratings. In this case,\n  the Clearinghouse Provider\
    \ would use a Temporary AAR Exception rating."
  humanURL: https://trolie.energy/spec-1.0
  tags:
  - Temporary AAR Exceptions
  properties:
